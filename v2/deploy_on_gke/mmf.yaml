# This is the fifo ("soloduel") MMF, reached by om-core through
# soloduel-service on port 80 (matchmaker.yaml sets SOLODUEL_PORT to "80"),
# which forwards to the container's gRPC port 8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: soloduel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: soloduel
  template:
    metadata:
      labels:
        app: soloduel
    spec:
      # The MMF server gives in-flight Run streams up to 8s to finish after
      # SIGTERM before force-closing them.
      terminationGracePeriodSeconds: 15
      containers:
      - name: soloduel
        image: us-docker.pkg.dev/open-match-public-images/open-match2/soloduel
        env:
        # The MMF defaults to 50090 for local runs; set PORT explicitly to match
        # containerPort and the Service targetPort.
        - name: PORT
          value: "8080"
        - name: MMF_FUNCTION
          value: "fifo"
        ports:
        - name: grpc
          containerPort: 8080
        # The MMF holds every ticket of a profile in memory while matching; size
        # the limit for the largest pools.
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            memory: 1Gi
        # Ready once the gRPC server accepts connections.
        readinessProbe:
          tcpSocket:
            port: grpc
          initialDelaySeconds: 1
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: soloduel-service
spec:
  selector:
    app: soloduel
  ports:
  - name: grpc
    port: 80
    targetPort: grpc
  type: ClusterIP
