# To use this cloudbuild.yaml from its directory:
#   gcloud builds submit --async --no-source
#
# Depending on how your project is set up, you may need to add the required Cloud Run role
# (https://cloud.google.com/run/docs/reference/iam/roles) to the Cloud Build
# service account using a gcloud command like this:
#   gcloud projects add-iam-policy-binding $(gcloud config get project) \
#     --member=serviceAccount:$(gcloud projects list --filter=$(gcloud config get project) --format="value(PROJECT_NUMBER)")-compute@developer.gserviceaccount.com \
#     --role=roles/run.developer
# You probably also need to allow Cloud Build to deploy using this application's custom Cloud Run _SERVICE_ACCOUNT:
#   gcloud iam service-accounts add-iam-policy-binding \
#     <_SERVICE_ACCOUNT>@$(gcloud config get project).iam.gserviceaccount.com \
#     --role=roles/iam.serviceAccountUser \
#     --member=serviceAccount:$(gcloud projects list --filter=$(gcloud config get project) --format="value(PROJECT_NUMBER)")-compute@developer.gserviceaccount.com

substitutions:
  # Cloud deploy vars
  _JOB_NAME: soloduel
  _REGION: us-central1
  _SERVICE_ACCOUNT: soloduel-identity
  # Artifact Registry repository and image names must be lowercase.
  _ARTIFACT_REGISTRY_REPO: open-match
  _MMF_IMAGE_NAME: soloduel:latest

  # Application environment vars
  _MMF_FUNCTION: fifo
  _LOGGING_LEVEL: info

steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: "Deploy:ingress internal, all egress vpc"
    waitFor: ["-"]
    entrypoint: gcloud
    args:
      - run
      - deploy
      # service config
      - ${_JOB_NAME}
      - --platform
      - managed
      - --region
      - ${_REGION}
      - --no-allow-unauthenticated
      - --service-account
      - ${_SERVICE_ACCOUNT}
      - --no-cpu-throttling
      - --execution-environment
      - gen2
      - --use-http2
      # Each InvokeMatchmakingFunctions call holds one streaming request open
      # for as long as the MMF runs. Cloud Run's default request timeout (300s)
      # is shorter than om-core's OM_MMF_TIMEOUT_SECS (default 600s), so without
      # this Cloud Run would cut long MMF streams before om-core does. 3600s is
      # Cloud Run's maximum; om-core's deadline still applies.
      - --timeout
      - "3600"
      # One warm instance avoids a cold start on the first matchmaking cycle
      # after a quiet period; set to "0" to scale to zero when idle.
      - --min-instances
      - "1"

      # Network config
      - --network
      - default
      - --subnet
      - default
      - --vpc-egress
      - all-traffic

      # ingress config
      - --ingress
      - internal

      # This MMF emits no metrics, so it is deployed without an
      # opentelemetry-collector sidecar. An instrumented MMF should add one
      # (see ../../matchmaker/deploy/cloudbuild.yaml for an example).

      # main 'mmf' container config
      - --container
      - mmf
      - --image
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_MMF_IMAGE_NAME}'
      # Cloud Run passes this to the container as the PORT env var.
      - --port
      - "8080"
      - --memory
      - 1024Mi

      # env vars for 'mmf'
      - --update-env-vars
      - "MMF_FUNCTION=${_MMF_FUNCTION}"
      - --update-env-vars
      - "LOGGING_LEVEL=${_LOGGING_LEVEL}"
