# To use this cloudbuild.yaml from its directory:
#   gcloud builds submit --async --no-source
#
# Depending on how your project is set up, you may need to add the required Cloud Run role
# (https://cloud.google.com/run/docs/reference/iam/roles) to the Cloud Build
# service account using a gcloud command like this:
#   gcloud projects add-iam-policy-binding $(gcloud config get project) \
#     --member=serviceAccount:$(gcloud projects list --filter=$(gcloud config get project) --format="value(PROJECT_NUMBER)")-compute@developer.gserviceaccount.com \
#     --role=roles/run.developer
# You probably also need to allow Cloud Build to deploy using this application's custom Cloud Run _SERVICE_ACCOUNT:
#   gcloud iam service-accounts add-iam-policy-binding \
#     <_SERVICE_ACCOUNT>@$(gcloud config get project).iam.gserviceaccount.com \
#     --role=roles/iam.serviceAccountUser \
#     --member=serviceAccount:$(gcloud projects list --filter=$(gcloud config get project) --format="value(PROJECT_NUMBER)")-compute@developer.gserviceaccount.com

substitutions:
  # Cloud deploy vars
  _JOB_NAME: mmqueue
  _REGION: us-central1
  _SERVICE_ACCOUNT: mmqueue-identity
  _ARTIFACT_REGISTRY_REPO: open-match-2-Test
  _MMQUEUE_IMAGE_NAME: om-standalone-mmqueue:0.0.1
  _OTEL_SIDECAR_IMAGE: otel-collector-sidecar

  # Application environment vars
  _OM_CORE_ADDR: OM_CORE_CLOUD_RUN_URL
  _PUBSUB_PROJECT_ID: GCP_PROJECT_ID
  _PUBSUB_ASSIGNMENT_SUBSCRIPTION: "om-demo-Subscription"
  _INITIAL_TPC: "0"

steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: "Deploy:ingress internal, all egress vpc"
    waitFor: ["-"]
    entrypoint: gcloud
    args:
      - run
      - deploy
      # service config
      - ${_JOB_NAME}
      - --platform
      - managed
      - --region
      - ${_REGION}
      - --no-allow-unauthenticated
      - --service-account
      - ${_SERVICE_ACCOUNT}
      - --no-cpu-throttling
      - --execution-environment
      - gen2
      - --min-instances
      - "1"

      # Network config
      - --network
      - default
      - --subnet
      - default
      - --vpc-egress
      - all-traffic

      # ingress config
      - --ingress
      - internal

      # sidecar 'opentelemetry-collector' config
      - --container
      - opentelemetry-collector
      - --image
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_OTEL_SIDECAR_IMAGE}'

      # main 'mmqueue' container config
      - --container
      - mmqueue
      - --image
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_MMQUEUE_IMAGE_NAME}'
      - --port
      - "8080"
      - --memory
      - 1024Mi

      # env vars for 'mmqueue'
      - --update-env-vars
      - "OM_CORE_ADDR=${_OM_CORE_ADDR}"
      - --update-env-vars
      - "PUBSUB_PROJECT_ID=${_PUBSUB_PROJECT_ID}"
      - --update-env-vars
      - "PUBSUB_ASSIGNMENT_SUBSCRIPTION=${_PUBSUB_ASSIGNMENT_SUBSCRIPTION}"
      - --update-env-vars
      - "INITIAL_TPC=${_INITIAL_TPC}"
      # Optional environment variable overrides (shown with defaults):
      # - --update-env-vars
      # - "LOGGING_FORMAT=json"
      # - --update-env-vars
      # - "LOGGING_LEVEL=info"
      # - --update-env-vars
      # - "OTEL_SIDECAR=true"
      # - --update-env-vars
      # - "PROM_PORT=2224"
      # - --update-env-vars
      # - "TICKET_CREATION_CYCLES=300"
      # - --update-env-vars
      # - "TICKET_CREATION_CYCLE_DURATION_MS=1000"
      # - --update-env-vars
      # - "MAX_CONCURRENT_TICKET_CREATIONS=500"
      # - --update-env-vars
      # - "OM_CORE_MAX_UPDATES_PER_ACTIVATION_CALL=500"
